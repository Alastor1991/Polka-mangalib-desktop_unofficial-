[package]
name = "polka-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ядро Полки без интерфейса: база, загрузчик, библиотека, синхронизация с аккаунтом"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
keyring = "4.2.0"
libsocial = { version = "0.1.0", path = "../libsocial" }
open = "5.4.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6.5"
