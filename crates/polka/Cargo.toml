[package]
name = "polka"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Полка: неофициальный десктопный клиент MangaLib и AnimeLib"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
iced = { version = "0.14.0", features = ["image", "tokio", "advanced"] }
libsocial = { version = "0.1.0", path = "../libsocial" }
polka-core = { version = "0.1.0", path = "../polka-core" }
open = "5.4.4"
serde_json = "1.0.154"
tao = "0.37.1"
tokio = { version = "1.53.2", features = ["full"] }
wry = "0.57.0"

