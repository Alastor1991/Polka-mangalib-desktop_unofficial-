[package]
name = "polka"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
iced = { version = "0.14.0", features = ["image", "tokio", "advanced"] }
libsocial = { version = "0.1.0", path = "../libsocial" }
open = "5.4.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
