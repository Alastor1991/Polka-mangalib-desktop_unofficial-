[package]
name = "libsocial"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "query", "form", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time", "sync"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
